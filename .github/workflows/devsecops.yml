name: DevSecOps

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  sast-semgrep:
    name: SAST · Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Informe completo (para DefectDojo)
        run: semgrep scan --config p/javascript --config p/typescript --json --output semgrep.json

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: semgrep-report
          path: semgrep.json

      - name: Quality gate (bloquea si hay severidad alta)
        run: semgrep scan --config p/javascript --config p/typescript --severity ERROR --error
  sca-dependency-check:
    name: SCA · Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generar package-lock.json (Juice Shop no lo trae)
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Recuperar la base de datos de CVE de ejecuciones anteriores
        uses: actions/cache@v4
        with:
          path: ~/.dc-data
          key: dc-data-${{ github.run_id }}
          restore-keys: dc-data-

      - name: Dependency-Check (modo AVISO si CVSS 7 o más)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p ~/.dc-data reports
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -v "$HOME/.dc-data":/usr/share/dependency-check/data \
            owasp/dependency-check:12.1.0 \
            --scan /src/package-lock.json --project juice-shop \
            --format JSON --format HTML --out /src/reports \
            ${NVD_API_KEY:+--nvdApiKey $NVD_API_KEY} \
            --failOnCVSS 7 \
          || echo "::warning title=SCA · Dependency-Check::Dependencias con CVSS 7 o más (modo aviso, no bloquea)"

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sca-report
          path: reports/dependency-check-report.json
  iac-trivy:
      name: IaC · Trivy
      runs-on: ubuntu-latest
      container:
        image: aquasec/trivy:0.58.1
      steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Informe completo (para DefectDojo)
        run: trivy config --format json --output trivy-iac.json .

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: iac-report
          path: trivy-iac.json

      - name: Quality gate en modo AVISO (media o más)
        run: |
          trivy config --severity MEDIUM,HIGH,CRITICAL --exit-code 1 . \
            || echo "::warning title=IaC · Trivy::Malas configuraciones de severidad media o más (modo aviso, no bloquea)"
  reportes:
    name: Reportes de seguridad
    runs-on: ubuntu-latest
    needs: [sast-semgrep,sca-dependency-check,iac-trivy]
    if: always()
    steps:
      - name: Descargar los informes de los otros jobs
        uses: actions/download-artifact@v5
        with:
          path: reportes
          merge-multiple: true

      - name: Mostrar los hallazgos en la página de la ejecución
        run: |
          f=reportes/semgrep.json
          alta=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' $f)
          media=$(jq '[.results[] | select(.extra.severity=="WARNING")] | length' $f)
          total=$(jq '.results | length' $f)
          {
            echo "## SAST · Semgrep"
            echo "**$total hallazgos:** $alta de severidad alta (ERROR, bloquean) y $media media (WARNING)."
            echo ""
            echo "| Severidad | Regla | Fichero:línea | Mensaje |"
            echo "|---|---|---|---|"
            jq -r '.results | sort_by(.extra.severity) | .[] | "| \(.extra.severity) | \(.check_id | split(".") | last) | `\(.path):\(.start.line)` | \(.extra.message | gsub("\n"; " ") | gsub("\\|"; "\\|")) |"' $f
          } >> $GITHUB_STEP_SUMMARY

      - name: Resumen SCA (Dependency-Check)
        run: |
          d=reportes/dependency-check-report.json
          [ -f "$d" ] || { echo "## SCA · Dependency-Check: sin informe" >> $GITHUB_STEP_SUMMARY; exit 0; }
          total=$(jq '[.dependencies[]?.vulnerabilities[]?] | length' $d)
          paquetes=$(jq '[.dependencies[]? | select(.vulnerabilities)] | length' $d)
          {
            echo "## SCA · Dependency-Check"
            echo "**$total vulnerabilidades en $paquetes dependencias** (modo aviso, no bloquean). Se muestran las 30 más graves; el resto está en el artifact."
            echo ""
            echo "| Severidad | CVE | Dependencia | CVSS |"
            echo "|---|---|---|---|"
            jq -r '[.dependencies[]? | .fileName as $p | .vulnerabilities[]? | {s: .severity, n: .name, p: $p, c: (.cvssv3.baseScore // .cvssv2.score // 0)}] | sort_by(-.c) | .[:30][] | "| \(.s) | \(.n) | `\(.p)` | \(.c) |"' $d
          } >> $GITHUB_STEP_SUMMARY
      - name: Resumen IaC (Trivy)
        run: |
          t=reportes/trivy-iac.json
          [ -f "$t" ] || { echo "## IaC · Trivy: sin informe" >> $GITHUB_STEP_SUMMARY; exit 0; }
          total=$(jq '[.Results[]?.Misconfigurations[]?] | length' $t)
          {
            echo "## IaC · Trivy"
            echo "**$total malas configuraciones** (modo aviso, no bloquean)."
            echo ""
            echo "| Severidad | Regla | Fichero:línea | Título |"
            echo "|---|---|---|---|"
            jq -r '.Results[]? | .Target as $f | .Misconfigurations[]? | "| \(.Severity) | \(.ID) | `\($f):\(.CauseMetadata.StartLine // "-")` | \(.Title) |"' $t
          } >> $GITHUB_STEP_SUMMARY
      - name: Subir todos los informes juntos
        uses: actions/upload-artifact@v5
        with:
          name: devsecops-reports
          path: reportes/        
